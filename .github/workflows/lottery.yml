name: Lottery Bot

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: write


jobs:

  lottery:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      - name: Run Lottery Bot

        run: |

          python lottery_bot.py


      - name: Save database and prediction

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add lottery.db prediction.json


          git diff --cached --quiet || git commit -m "Auto update lottery data"


          git push
