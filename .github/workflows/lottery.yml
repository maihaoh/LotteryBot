name: Lottery Bot

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: write


jobs:

  lottery:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # =====================================================
      # Install
      # =====================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # =====================================================
      # Run Bot
      # =====================================================

      - name: Run Lottery Bot

        run: |

          python lottery_bot.py


      # =====================================================
      # Save files
      # =====================================================

      - name: Save database and webpage

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add lottery.db prediction.json index.html


          git diff --cached --quiet || git commit -m "Auto update lottery webpage"


          git push
