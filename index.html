<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lottery AI</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 18px;

    min-height: 100vh;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #111827
        );

    color: white;
}

.container {

    max-width: 620px;

    margin: auto;
}

.header {

    text-align: center;

    margin-bottom: 18px;
}

.header h1 {

    margin: 0;

    font-size: 30px;
}

.status {

    margin-top: 8px;

    color: #22c55e;

    font-weight: bold;
}

.card {

    background:
        rgba(
            255,
            255,
            255,
            0.07
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.1
        );

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 14px;
}

.title {

    color: #94a3b8;

    font-size: 14px;

    margin-bottom: 8px;
}

.issue {

    color: #cbd5e1;

    font-size: 15px;
}

.big-number {

    text-align: center;

    font-size: 72px;

    font-weight: bold;

    margin: 10px 0;
}

.prediction-number {

    text-align: center;

    font-size: 68px;

    font-weight: bold;

    margin: 10px 0;
}

.badges {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;
}

.badge {

    background:
        rgba(
            255,
            255,
            255,
            0.1
        );

    padding:
        7px 13px;

    border-radius: 20px;

    font-weight: bold;
}

.top-list {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 10px;

    margin-top: 15px;
}

.top-item {

    text-align: center;

    padding: 14px;

    border-radius: 14px;

    background:
        rgba(
            255,
            255,
            255,
            0.06
        );
}

.top-number {

    font-size: 30px;

    font-weight: bold;
}

.score {

    color: #94a3b8;

    font-size: 12px;

    margin-top: 5px;
}

.result-grid {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap: 10px;
}

.result-box {

    padding: 14px;

    border-radius: 14px;

    text-align: center;

    background:
        rgba(
            255,
            255,
            255,
            0.06
        );
}

.result-name {

    color: #94a3b8;

    font-size: 13px;
}

.result-status {

    font-size: 24px;

    margin: 6px 0;

    font-weight: bold;
}

.win {

    color: #22c55e;
}

.loss {

    color: #ef4444;
}

.rate {

    font-size: 20px;

    font-weight: bold;
}

.stat-row {

    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    border-bottom:
        1px solid
        rgba(
            255,
            255,
            255,
            0.06
        );
}

.stat-row:last-child {

    border-bottom: none;
}

.footer {

    text-align: center;

    color: #64748b;

    font-size: 12px;

    line-height: 1.6;

    margin-top: 18px;
}

.update-time {

    text-align: center;

    color: #64748b;

    font-size: 12px;

    margin-top: 8px;
}

@media (
    max-width: 450px
) {

    body {
        padding: 10px;
    }

    .big-number {
        font-size: 62px;
    }

    .prediction-number {
        font-size: 58px;
    }

    .result-grid {
        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>🎯 LOTTERY AI</h1>

<div
    id="status"
    class="status"
>
🟢 ONLINE
</div>

</div>


<!-- 最新开奖 -->

<div class="card">

<div class="title">
📡 最新开奖
</div>

<div
    id="latestIssue"
    class="issue"
>
-
</div>

<div
    id="latestNumber"
    class="big-number"
>
-
</div>

<div
    id="latestBadges"
    class="badges"
>
</div>

</div>


<!-- 下一期预测 -->

<div class="card">

<div class="title">
🔮 下一期预测
</div>

<div
    id="predictionIssue"
    class="issue"
>
-
</div>

<div
    id="predictionNumber"
    class="prediction-number"
>
-
</div>

<div
    id="predictionBadges"
    class="badges"
>
</div>

<div class="top-list">

<div class="top-item">

<div>🥇</div>

<div
    id="top1"
    class="top-number"
>
-
</div>

<div
    id="score1"
    class="score"
>
-
</div>

</div>


<div class="top-item">

<div>🥈</div>

<div
    id="top2"
    class="top-number"
>
-
</div>

</div>


<div class="top-item">

<div>🥉</div>

<div
    id="top3"
    class="top-number"
>
-
</div>

</div>

</div>

</div>


<!-- 上一期 -->

<div class="card">

<div class="title">
📋 上一期预测结果
</div>

<div
    id="previousIssue"
    class="issue"
>
暂无结算数据
</div>

<div
    id="previousResults"
    class="result-grid"
>
</div>

</div>


<!-- 胜率 -->

<div class="card">

<div class="title">
📊 AI 胜率统计
</div>

<div class="stat-row">

<span>
🔢 数字
</span>

<span id="numberStats">
-
</span>

</div>


<div class="stat-row">

<span>
🎨 颜色
</span>

<span id="colourStats">
-
</span>

</div>


<div class="stat-row">

<span>
📏 大小
</span>

<span id="sizeStats">
-
</span>

</div>

</div>


<!-- 系统 -->

<div class="card">

<div class="title">
⚙️ 系统
</div>

<div class="stat-row">

<span>
数据库
</span>

<span id="totalDraws">
-
</span>

</div>


<div class="stat-row">

<span>
最后更新
</span>

<span id="updatedAt">
-
</span>

</div>

<div class="stat-row">

<span>
网页数据
</span>

<span>
GitHub Pages
</span>

</div>

</div>


<div class="footer">

模型根据历史开奖数据自动调整统计权重。<br>

数字、颜色、大小分别独立统计胜率。<br>

开奖结果具有随机性，不能保证预测准确。

</div>


</div>


<script>


/*
=========================================================
PYTHON 会自动更新这里的数据
=========================================================
*/

const LOTTERY_DATA = {"status":"ONLINE","updated_at":"2026-09-21 12:18:27","total_draws":30,"latest":{"issue":"20260921100051476","number":0,"size":"小","colours":["red","violet"]},"prediction":{"issue":"20260921100051477","top1":1,"top2":5,"top3":0,"top1_score":15.5,"size":"小","colours":["green"]},"previous_result":null,"statistics":{"number":{"win":0,"loss":0,"total":0,"rate":0},"colour":{"win":0,"loss":0,"total":0,"rate":0},"size":{"win":0,"loss":0,"total":0,"rate":0}},"rules":{"size":"0-4 小 / 5-9 大","colour":"0 红+紫 / 5 绿+紫 / 13579 绿 / 2468 红"},"disclaimer":"统计模型根据历史数据进行分析，开奖结果具有随机性，不能保证预测准确。"};


/* =====================================================
   数字 → 大小
===================================================== */

function getSize(number) {

    number = Number(number);

    if (
        number >= 0 &&
        number <= 4
    ) {

        return "🔵 小";

    }

    return "🟠 大";
}


/* =====================================================
   数字 → 颜色
===================================================== */

function getColours(number) {

    number = Number(number);

    if (number === 0) {

        return [
            "🔴 红色",
            "🟣 紫色"
        ];

    }

    if (number === 5) {

        return [
            "🟢 绿色",
            "🟣 紫色"
        ];

    }

    if (
        number === 1 ||
        number === 3 ||
        number === 7 ||
        number === 9
    ) {

        return [
            "🟢 绿色"
        ];

    }

    return [
        "🔴 红色"
    ];
}


/* =====================================================
   Badge
===================================================== */

function createBadges(number) {

    const colours =
        getColours(number);

    colours.push(
        getSize(number)
    );

    return colours
        .map(
            item =>
                `<span class="badge">${item}</span>`
        )
        .join("");
}


/* =====================================================
   WIN / LOSS
===================================================== */

function resultBox(
    name,
    result
) {

    if (!result) {

        return `
            <div class="result-box">

                <div class="result-name">
                    ${name}
                </div>

                <div class="result-status">
                    -
                </div>

            </div>
        `;
    }

    const isWin =
        result === "WIN";

    return `
        <div class="result-box">

            <div class="result-name">
                ${name}
            </div>

            <div class="result-status ${
                isWin
                    ? "win"
                    : "loss"
            }">

                ${
                    isWin
                        ? "✅ WIN"
                        : "❌ LOSS"
                }

            </div>

        </div>
    `;
}


/* =====================================================
   胜率
===================================================== */

function formatStats(stats) {

    return `
        ${stats.rate}%
        （${stats.win}胜 /
        ${stats.loss}负）
    `;
}


/* =====================================================
   显示数据
===================================================== */

function loadData() {

    try {

        const data =
            LOTTERY_DATA;

        document.getElementById(
            "status"
        ).innerText =
            "🟢 ONLINE";


        /* 最新开奖 */

        document.getElementById(
            "latestIssue"
        ).innerText =
            "期号：" +
            data.latest.issue;


        document.getElementById(
            "latestNumber"
        ).innerText =
            data.latest.number;


        document.getElementById(
            "latestBadges"
        ).innerHTML =
            createBadges(
                data.latest.number
            );


        /* 下一期 */

        document.getElementById(
            "predictionIssue"
        ).innerText =
            "预测期号：" +
            data.prediction.issue;


        document.getElementById(
            "predictionNumber"
        ).innerText =
            data.prediction.top1;


        document.getElementById(
            "predictionBadges"
        ).innerHTML =
            createBadges(
                data.prediction.top1
            );


        /* Top 3 */

        document.getElementById(
            "top1"
        ).innerText =
            data.prediction.top1;


        document.getElementById(
            "top2"
        ).innerText =
            data.prediction.top2;


        document.getElementById(
            "top3"
        ).innerText =
            data.prediction.top3;


        document.getElementById(
            "score1"
        ).innerText =
            data.prediction.top1_score +
            "%";


        /* 上一期 */

        const previous =
            data.previous_result;


        if (previous) {

            document.getElementById(
                "previousIssue"
            ).innerText =
                "期号：" +
                previous.issue +
                "｜预测 " +
                previous.predicted_number +
                " → 实际 " +
                previous.actual_number;


            document.getElementById(
                "previousResults"
            ).innerHTML =

                resultBox(
                    "🔢 数字",
                    previous.number_result
                )

                +

                resultBox(
                    "🎨 颜色",
                    previous.colour_result
                )

                +

                resultBox(
                    "📏 大小",
                    previous.size_result
                );

        }


        /* 胜率 */

        document.getElementById(
            "numberStats"
        ).innerText =
            formatStats(
                data.statistics.number
            );


        document.getElementById(
            "colourStats"
        ).innerText =
            formatStats(
                data.statistics.colour
            );


        document.getElementById(
            "sizeStats"
        ).innerText =
            formatStats(
                data.statistics.size
            );


        /* 系统 */

        document.getElementById(
            "totalDraws"
        ).innerText =
            data.total_draws +
            " 期";


        document.getElementById(
            "updatedAt"
        ).innerText =
            data.updated_at;

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).innerText =
            "🔴 DATA ERROR";
    }
}


loadData();


</script>


</body>

</html>
